    * {

    /* Gold Gradient Text - Match samurai-marketing.com */
    .gold-gradient {
      background: linear-gradient(100deg, #b8892f 0%, #e0c17a 34%, #e0c17a 62%, #b8892f 100%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f5f5f7;
    }
    ::-webkit-scrollbar-thumb {
      background: #c9c9c9;
      border-radius: 4px;
    }

    /* Modal backdrop */
    .modal-backdrop {
      backdrop-filter: blur(8px);
    }

    /* Cover gradients by tag */
    .cover-productivite {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .cover-edition-video {

    .cover-vibe-coding {

    }
    .cover-organisation {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    .cover-images {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }
    .cover-marketing {
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
    }
    .cover-hack-videos {

    }
    .cover-agents-ia {

    }
    .cover-contenu {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    }
    .cover-default {
      background: linear-gradient(135deg, #B8860B 0%, #D4AF37 100%);
    }

    /* Hide scrollbar for tags carousel */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Detail view animations */
    .detail-enter {
      animation: slideInRight 0.3s ease-out;
    }

    .detail-exit {
      animation: slideOutRight 0.3s ease-in;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideOutRight {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 0;
        transform: translateX(20px);
      }
    }

    /* ---- Section CTA : forme copiee de texheyit.com/mon-histoire ---- */
    .close-stage-hub {
      position: relative; display: grid; align-content: center; justify-items: start;
      padding: clamp(80px, 12vh, 140px) clamp(20px, 7vw, 110px);
      overflow: hidden; background: #030303; min-height: clamp(520px, 78vh, 760px);
    }
    .close-vid-hub {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: 68% 50%; z-index: 0;
    }
    .close-veil-hub {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(90deg, rgba(3,3,3,0.82) 0%, rgba(3,3,3,0.62) 34%,
                  rgba(3,3,3,0.16) 56%, rgba(3,3,3,0) 74%);
    }
    .close-inner-hub {
      position: relative; z-index: 2; max-width: 34rem;
      display: grid; justify-items: start; text-align: left;
    }
    .close-kicker-hub {
      color: #c99b43; font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.1em; margin-bottom: 1.1rem;
    }
    .close-title-hub {
      font-weight: 700; letter-spacing: -0.04em; text-wrap: balance; color: #f2efe8;
      font-size: clamp(2.2rem, 1.5rem + 3.3vw, 3.95rem); line-height: 1.06;
    }
    .ct-gold-hub {
      background: linear-gradient(100deg, #b8892f 0%, #e0c17a 34%, #e0c17a 62%, #b8892f 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }
    .close-body-hub {
      margin-top: 1.5rem; max-width: 42ch; color: #8a8275;
      font-size: 1.02rem; line-height: 1.55;
    }
    .close-body-hub strong { color: #f2efe8; font-weight: 700; }
    .close-cta-hub {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 2rem; background: #fff; color: #101114;
      text-decoration: none; font-weight: 500; font-size: 0.95rem;
      min-height: 44px; padding: 0 21px; border-radius: 999px;
      transition: background-color 160ms ease;
    }
    .close-cta-hub:hover { background: #f2efe8; }
    /* Desktop : la video paysage ; mobile : la version 9:16 recadree */
    .close-vid-hub--mobile { display: none; }

    @media (max-width: 800px) {
      .close-vid-hub--desktop { display: none; }
      .close-vid-hub--mobile { display: block; object-position: 50% 50%; }

      /* Le texte descend en bas de scene : le visage reste visible en haut */
      .close-stage-hub {
        align-content: end;
        min-height: 100svh;
        padding: 0 22px calc(env(safe-area-inset-bottom, 0px) + 44px);
      }
      .close-inner-hub { max-width: 100%; }
      .close-title-hub { font-size: clamp(1.95rem, 8.2vw, 2.5rem); }
      .close-body-hub { margin-top: 1rem; font-size: 0.97rem; }

      /* Degrade : opaque en bas, transparent en haut pour reveler le visage */
      .close-veil-hub {
        background: linear-gradient(to top,
                    rgba(3,3,3,1) 0%,
                    rgba(3,3,3,0.96) 22%,
                    rgba(3,3,3,0.80) 42%,
                    rgba(3,3,3,0.46) 62%,
                    rgba(3,3,3,0.18) 80%,
                    rgba(3,3,3,0) 100%);
      }

      /* Bouton en pile, pleine largeur, police reduite pour tenir sur UNE ligne */
      .close-cta-hub {
        display: block; width: 100%; text-align: center;
        margin-top: 1.6rem; font-size: 0.88rem;
        padding: 0.92em 1rem; white-space: nowrap;
      }
    }
